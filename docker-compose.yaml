services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: ai-battle-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_battle_db}
      POSTGRES_USER: ${POSTGRES_USER:-ai_battle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_battle_password}
    ports:
      - ${HOST_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_battle_user} -d ${POSTGRES_DB:-ai_battle_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build: .
    container_name: ai-battle-backend
    ports:
      - ${HOST_SERVER_PORT:-8080}:8080
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: