spring:
  application:
    name: demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:ai_battle_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:ai_battle_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:ai_battle_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  path: /scalar

jwt:
  secret: ${JWT_SECRET:super-secret-please-change-to-a-strong-value-but-must-be-long-enough}
  access-token-validity-seconds: 900
  refresh-token-validity-seconds: 604800