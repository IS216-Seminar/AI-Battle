spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:ai_battle_db}
    username: ${POSTGRES_USER:ai_battle_user}
    password: ${POSTGRES_PASSWORD:ai_battle_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  path: /scalar

jwt:
  secret: ${JWT_SECRET:your-secret-key-that-must-be-at-least-32-characters-long-for-hs256}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}